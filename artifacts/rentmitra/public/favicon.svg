<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- White background -->
  <rect width="64" height="64" rx="12" fill="#ffffff"/>
  <!-- Partial orange arc (open circle, like the logo) -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#FF6B00" stroke-width="4.5"
    stroke-dasharray="100 25" stroke-dashoffset="12"
    stroke-linecap="round"/>
  <!-- Dot top -->
  <circle cx="47" cy="16" r="3.5" fill="#FF6B00"/>
  <!-- Dot bottom -->
  <circle cx="17" cy="48" r="3.5" fill="#1F2937"/>
  <!-- N lettermark in orange -->
  <text
    x="32" y="42"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="26"
    fill="#FF6B00"
    letter-spacing="-1"
  >N</text>
</svg>
